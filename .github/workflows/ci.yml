name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: cp .env.example .env
      - name: Build images
        run: scripts/ci-step.sh docker compose build --progress=plain backend
      - name: Lint
        run: |
          scripts/ci-step.sh docker compose run --rm --no-deps backend ruff check .
          scripts/ci-step.sh docker compose run --rm --no-deps backend ruff format --check .
      - name: Type-check
        run: scripts/ci-step.sh docker compose run --rm --no-deps backend mypy .
      - name: Build fixtures
        run: scripts/ci-step.sh make fixtures
      - name: Fixtures are up to date
        run: scripts/ci-step.sh git diff --exit-code -- fixtures/generated/manifest.json
      - name: Tests
        run: scripts/ci-step.sh make test-backend

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @spatial/web build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make env
      # Every test signs in from this one machine, far more often than a person would.
      - run: sed -i 's|^THROTTLE_LOGIN=.*|THROTTLE_LOGIN=600/min|' .env
      - name: Start stack
        run: scripts/ci-step.sh docker compose up -d --build --wait
      - name: Seed demo accounts
        run: scripts/ci-step.sh docker compose exec -T backend python manage.py seed_demo
      - name: Build test fixtures (used by the import tests)
        run: scripts/ci-step.sh docker compose exec -T backend python manage.py build_fixtures
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @spatial/web exec playwright install --with-deps chromium
      - run: scripts/ci-step.sh pnpm --filter @spatial/web e2e
      - name: Phase 8 gate (a .spp file opens on a second stack)
        run: scripts/ci-step.sh scripts/qa-phase-8-two-servers.sh
      - name: Phase 13 gate (20 field users syncing at once)
        run: scripts/ci-step.sh python3 scripts/load-sync.py
      - name: Phase 13 gate (a backup restores into an empty stack)
        run: scripts/ci-step.sh scripts/qa-phase-13-restore.sh
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200
          scripts/ci-service-logs.sh

  # A new server installed by scripts/server-setup.sh: HTTPS through Caddy (a
  # local certificate, as the address is localhost), then the same command
  # again as an update.
  server-setup:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Install as on a new server
        run: SKIP_SYSTEM=true DIR="$PWD" scripts/ci-step.sh scripts/server-setup.sh localhost
      - name: Check it
        run: scripts/ci-step.sh scripts/qa-server-setup.sh
      # Piped into bash, as the server's deploy key and curl ... | bash run it.
      - name: Run it again, as an update (backup first)
        run: |
          SKIP_SYSTEM=true DIR="$PWD" BRANCH="${{ github.head_ref || github.ref_name }}" \
            scripts/ci-step.sh bash -c 'bash < scripts/server-setup.sh' | tee update.log
          grep -q "Updated\." update.log
      - name: The update made a backup
        run: ls backups/*/db.dump
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200

  # The production configuration: built images, gunicorn, nginx, real secrets.
  production:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: A production .env
        run: WEB_PORT=8080 scripts/make-production-env.sh localhost > .env
      - name: Start the production stack
        run: scripts/ci-step.sh docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
      - name: Check it
        run: WEB_PORT=8080 scripts/ci-step.sh scripts/qa-phase-13-production.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=200

  # Deploys main to the server once every check above has passed. Needs the
  # repository secrets DEPLOY_HOST, DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS
  # (docs/ops/digitalocean.md, "Automatic deployment"); without them it
  # only says so. On the server, that key may run nothing but the update.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, web, mobile, e2e, production, server-setup]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - name: Deploy to the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::notice::The deployment secrets aren't set, so nothing was deployed."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server runs the update for this key whatever is asked.
          ssh -i ~/.ssh/deploy_key -o ServerAliveInterval=30 -o StrictHostKeyChecking=yes "root@$HOST" 2>&1 | tee deploy.log
          test "${PIPESTATUS[0]}" -eq 0
          # The update ends by saying so; anything else means it stopped early.
          grep -q "Updated\." deploy.log || { echo "::error::The update on the server didn't finish."; exit 1; }
